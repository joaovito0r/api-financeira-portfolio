name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Os testes trocam o transporte HTTP do cliente brapi por um mock
      # (httpx.MockTransport), então o token só precisa existir para o
      # cliente inicializar: nenhuma chamada real à brapi sai daqui.
      BRAPI_TOKEN: token-de-ci-sem-valor-real

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Run tests
        run: pytest
