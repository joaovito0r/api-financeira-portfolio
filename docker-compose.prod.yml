# Stack de produção deste app. O reverse proxy (Caddy) NÃO mora aqui — é
# compartilhado entre todos os projetos da VPS, ver /home/joao/portifolio/infra/.
# Antes de subir esta stack, criar a rede uma vez: docker network create edge
#
# "name:" explícito para não colidir com o docker-compose.yml de dev, que
# mora na mesma pasta — sem isso os dois usariam o mesmo nome de projeto
# (derivado do diretório) e acabariam compartilhando o volume do Postgres.
name: financial-api-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeira
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: financeira
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeira"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  api:
    build: .
    container_name: financial-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://financeira:${POSTGRES_PASSWORD}@db:5432/financeira
      BRAPI_TOKEN: ${BRAPI_TOKEN}
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge
    # Sem "ports:" de propósito — só alcançável pelo Caddy compartilhado,
    # via rede externa "edge", nunca direto pela internet.

networks:
  default:
  edge:
    external: true

volumes:
  pgdata:
