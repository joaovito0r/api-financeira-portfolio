services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeira
      POSTGRES_PASSWORD: financeira
      POSTGRES_DB: financeira
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeira"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://financeira:financeira@db:5432/financeira
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
